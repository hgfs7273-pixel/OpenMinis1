name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/tools/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.22.1" "ndk;28.0.12433566"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.12433566" >> $GITHUB_ENV
      - run: cp src/android/app/provider-customization.properties.example src/android/app/provider-customization.properties || true
      - run: ./deps/build_proot.sh
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.0.12433566
      - run: ./scripts/prepare_android_sandbox.sh
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Build rclone AAR
        run: |
          mkdir -p src/android/app/libs
          if [ ! -f src/android/app/libs/rclone.aar ]; then
            export PATH="$PATH:$(go env GOPATH)/bin"
            go install golang.org/x/mobile/cmd/gomobile@latest
            gomobile init
            export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.12433566"
            ./deps/build_rclone_android.sh
            cp deps/build/rclone/rclone.aar src/android/app/libs/rclone.aar
          fi
      - run: cd src/android && chmod +x gradlew && ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: src/android/app/build/outputs/apk/debug/app-debug.apk
