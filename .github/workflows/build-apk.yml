name: Build APK
on:
  push:
    branches: [ fix/x-opencode-session ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK r28
        run: sdkmanager "ndk;28.0.12433566" "cmake;3.22.1"

      - name: Copy customization template
        run: cp src/android/app/provider-customization.properties.example src/android/app/provider-customization.properties

      - name: Build sandbox
        run: |
          chmod +x deps/build_proot.sh scripts/prepare_android_sandbox.sh
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.0.12433566

      - name: Build APK
        working-directory: src/android
        run: ./gradlew :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Minis-fixed-APK
          path: src/android/app/build/outputs/apk/debug/app-debug.apk
